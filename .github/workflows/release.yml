# Push a tag like v1.0.0 to build lenmu-video.zip and attach it to a GitHub Release.
name: Release skill zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip (skill folder at zip root)
        run: |
          cd skills
          zip -r ../lenmu-video.zip lenmu-video -x '*/__pycache__/*' '*.pyc' '*.onnx'
      - name: Publish release (gh CLI, no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lenmu-video.zip --clobber
          else
            gh release create "$TAG" lenmu-video.zip --generate-notes
          fi
